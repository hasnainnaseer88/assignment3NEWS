        <h1>Riot police clash with students as education protests rage in France</h1>

        <img src="../Gallery/n2.jpg" alt="">
        <figcaption>High school students face off against riot police during a protest in Montpellier</figcaption>

        <p>Riot police have clashed with protesters as thousands of students demonstrating over education standards disrupted more than 700 schools in France on Friday.</p><br>

        <p>Fires have burned in the streets as high school pupils and others objected to a lack of teachers, overcrowded classrooms and run-down buildings.</p><br>

        <p>The protests began last week in the capital Paris and have spread across the country, with cities including Montpellier, Nantes and Marseille affected.</p><br>

        <p>French justice minister Gerald Darmanin said things had "gone from high-school student demonstrations to a public order disturbance". </p><br>

        <p>On Friday, a 17-year-old was arrested on suspicion of attempted homicide after protests in Belfort, north-eastern France, where a police officer was targeted.</p><br>

        <p>BBC Verify has now authenticated two videos that show the man, who was later identified as an officer by a minister, being beaten up near a school in Belfort.</p><br>

        <p>In the graphic footage, a group of young men are seen chasing him. The officer falls to the ground, and is subsequently punched and kicked multiple times in the head.</p><br>

        <p>At least 65 staff members have been injured in the unrest, the education ministry said.</p><br>

        <p>In the Paris suburb of Pantin police charged at protesters and made arrests after projectiles where thrown at officers.</p><br>

        <p>Meanwhile, in Strasbourg tear gas was deployed as police feared conditions would become more hostile, according to the Reuters news agency.</p><br>

        <p>Rubbish bins have also been set on fire in Rennes and Paris.</p><br>

        <p>"As far as we're concerned, we've won - our school is closed this morning," Lola, a 16-year-old protester, told the AFP news agency on Friday.</p><br>

        <p>She said police actions had made things worse.</p><br>

        <p>"It makes us even angrier - the police have no right to hit us or use tear gas on us," she added.</p><br>

        <P>Police published pictures of some of the items they had seized from demonstrators, including petrol bombs, an axe and so-called mortar fireworks.</p><br>
